<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScaleNav 在线日志回放</title>
<style>
body{margin:0;background:#f3f6f8;color:#1b2733;font:14px system-ui,sans-serif}header{padding:12px 18px;background:#fff;border-bottom:1px solid #d8e0e7;display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}select,button,input{padding:7px 9px;border:1px solid #b9c7d2;border-radius:4px;background:#fff;color:inherit}button{cursor:pointer}.grow{flex:1}main{display:grid;grid-template-columns:minmax(700px,1fr) 360px;gap:12px;padding:12px}.panel{background:#fff;border:1px solid #d8e0e7;border-radius:6px;padding:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar input[type=range]{flex:1;min-width:240px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.wide{grid-column:1/-1}canvas{width:100%;background:#10161b;border:1px solid #cfd9e1}h2{font-size:13px;margin:0 0 9px;color:#405465}.metric{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid #edf0f2}.muted{color:#667786}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:280px;overflow:auto}.candidate{padding:6px;border-bottom:1px solid #edf0f2;cursor:pointer}.candidate.active{background:#e6f4f7;border-left:3px solid #087ea4}.ok{color:#0b8751}.bad{color:#c0392b}@media(max-width:900px){main{display:block}.panel+ .panel{margin-top:12px}.grid{grid-template-columns:1fr}}
</style>
<header><h1>ScaleNav 在线日志回放</h1><span class="muted">日志</span><select id="session"></select><button id="refresh">刷新</button><span class="grow"></span><span class="muted">推理帧</span><select id="frame"></select><button id="prev">上一帧</button><button id="next">下一帧</button><button id="play">播放</button></header>
<main><section class="panel"><div class="toolbar"><span id="info" class="muted">-</span><input id="slider" type="range" min="0" max="0" value="0"><span id="cursor">0/0</span></div><div class="grid"><div><h2>深度图</h2><canvas id="depth" width="640" height="384"></canvas></div><div><h2>当前帧</h2><canvas id="scene" width="640" height="384"></canvas></div><div class="wide"><h2>世界 XY 对比</h2><canvas id="plot" width="1280" height="620"></canvas></div></div></section><aside class="panel"><h2>在线推理</h2><div id="metrics"></div><h2 style="margin-top:16px">候选轨迹</h2><div id="candidates"></div><h2 style="margin-top:16px">原日志规划结果</h2><pre id="original">选择帧后显示</pre></aside></main>
<script>
const $=id=>document.getElementById(id);let sessions=[],records=[],depths=[],active=0,timer=null,inference=null;
const fmt=(v,d=2)=>Number.isFinite(Number(v))?Number(v).toFixed(d):'-';
async function json(url){const r=await fetch(url);const v=await r.json();if(!r.ok||v.error)throw Error(v.error||r.statusText);return v}
async function loadSessions(){sessions=await json('/api/sessions');$('session').replaceChildren(...sessions.map(s=>{const o=document.createElement('option');o.value=s.name;o.textContent=`${s.name} (${(s.bytes/1048576).toFixed(1)} MiB)`;return o}));if(sessions.length)await loadSession()}
async function loadSession(){records=await json('/api/records?session='+encodeURIComponent($('session').value));depths=records.filter(r=>r.kind==='depth'&&r.file);$('frame').replaceChildren(...depths.map((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1} · ${(Number(r.stamp_ns)*1e-9).toFixed(3)} s`;return o}));$('slider').max=Math.max(0,depths.length-1);active=0;await selectFrame(0)}
function latest(kind,stamp){return records.filter(r=>r.kind===kind&&Number(r.stamp_ns)<=stamp).at(-1)}
async function selectFrame(i){if(!depths.length)return;active=Math.max(0,Math.min(depths.length-1,i));$('slider').value=active;$('frame').value=active;$('cursor').textContent=`${active+1}/${depths.length}`;const d=depths[active],stamp=Number(d.stamp_ns),od=latest('odom',stamp),path=latest('path',stamp),local=latest('local_goal',stamp)||latest('goal',stamp);$('info').textContent=`${d.file} · ${new Date(stamp/1e6).toISOString()}`;const original={stamp_ns:stamp,odom:od?.data||null,local_goal:local?.data||null,path:path?.file||null};$('original').textContent=JSON.stringify(original,null,2);drawScene(od?.data?.position||[0,0,0]);try{inference=await json(`/api/infer?session=${encodeURIComponent($('session').value)}&index=${active}`);drawInference(inference)}catch(e){inference=null;$('metrics').innerHTML=`<div class="bad">${e.message}</div>`;$('candidates').replaceChildren()} }
function drawScene(pos){const c=$('scene'),x=c.getContext('2d');x.fillStyle='#10161b';x.fillRect(0,0,c.width,c.height);x.fillStyle='#d6dee5';x.font='16px system-ui';x.fillText('在线推理轨迹见下方 XY 图',18,28);x.fillStyle='#ffd166';x.beginPath();x.arc(c.width/2,c.height/2,8,0,7);x.fill();x.fillStyle='#fff';x.fillText(`pose [${pos.map(v=>fmt(v,2)).join(', ')}]`,18,c.height-18)}
function drawInference(r){const cs=r.candidates||[],sel=r.selected;const states={};for(const c of cs)states[c.state]=(states[c.state]||0)+1;$('metrics').innerHTML=`<div class="metric"><span>特征版本</span><b>${r.feature_order||'-'}</b></div><div class="metric"><span>候选数量</span><b>${cs.length}</b></div><div class="metric"><span>选中 primitive</span><b>${sel==null?'-':sel}</b></div><div class="metric"><span>安全状态</span><b>${Object.entries(states).map(([k,v])=>`${k}:${v}`).join(' ')}</b></div>`;$('candidates').replaceChildren(...cs.map((c,i)=>{const d=document.createElement('div');d.className='candidate'+(i===sel?' active':'');d.innerHTML=`#${i} · ${c.state} · score ${fmt(c.score,3)} · clearance ${fmt(c.clearance_m,2)} m`;d.onclick=()=>drawCandidate(i);return d}));drawCandidate(sel==null?0:sel)}
function drawCandidate(index){if(!inference)return;const c=inference.candidates[index];const canvas=$('plot'),x=canvas.getContext('2d');x.fillStyle='#10161b';x.fillRect(0,0,canvas.width,canvas.height);const paths=[...(inference.path||[]),...(c?.trajectory||[])];if(!paths.length)return;const minx=Math.min(...paths.map(p=>p[0]))-2,maxx=Math.max(...paths.map(p=>p[0]))+2,miny=Math.min(...paths.map(p=>p[1]))-2,maxy=Math.max(...paths.map(p=>p[1]))+2,s=Math.min((canvas.width-70)/(maxx-minx||1),(canvas.height-70)/(maxy-miny||1)),X=v=>35+(v-minx)*s,Y=v=>canvas.height-35-(v-miny)*s;function line(ps,col,w){if(!ps||ps.length<2)return;x.strokeStyle=col;x.lineWidth=w;x.beginPath();ps.forEach((p,i)=>i?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1])));x.stroke()}line(inference.path,'#39b5d5',5);(inference.candidates||[]).forEach((q,i)=>{if(i!==index)line(q.trajectory,q.state==='CERTIFIED'?'#65b891':'#bd6d6d',1)});line(c?.trajectory,'#ffd166',5);x.fillStyle='#fff';x.font='13px monospace';x.fillText(`original path (cyan) · selected online candidate #${index} (yellow)`,12,20)}
function toggle(){if(timer){clearInterval(timer);timer=null;$('play').textContent='播放'}else{$('play').textContent='暂停';timer=setInterval(()=>{if(active>=depths.length-1){clearInterval(timer);timer=null;$('play').textContent='播放'}else selectFrame(active+1)},500)}}
$('refresh').onclick=()=>loadSessions().catch(e=>alert(e.message));$('session').onchange=()=>loadSession().catch(e=>alert(e.message));$('slider').oninput=e=>selectFrame(+e.target.value);$('frame').onchange=e=>selectFrame(+e.target.value);$('prev').onclick=()=>selectFrame(active-1);$('next').onclick=()=>selectFrame(active+1);$('play').onclick=toggle;loadSessions().catch(e=>{$('info').textContent=e.message});
</script>
