scalenav_graph:
  ros__parameters:
    # Refresh the rolling frontier after this fraction of the route is flown.
    frontier_replan_progress_ratio: 0.40

    # Maximum radius of the local topology graph searched by frontier A*.
    local_graph_radius_m: 45.0

    # PEARL calibrated semantic-risk threshold. Lower values preserve weak
    # far-field evidence; collision geometry still decides edge validity.
    semantic_point_min_score: 0.20

    # A fixed-depth semantic endpoint is a provisional far frontier. Attach it
    # only to nearby measured topology; a real Bubble later replaces it.
    "bubble_topo/semantic_point_connection_candidates": 4
    "bubble_topo/semantic_point_max_connections": 2

scalenav_online_planner:
  ros__parameters:
    # YOPO inference speed and hard trajectory cap. The trained 6 m/s contract
    # is scaled using the original YOPO testing rule; no retraining is needed.
    maximum_trajectory_speed_mps: 6.0
