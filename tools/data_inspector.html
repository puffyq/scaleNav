<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenSeek 数据检查</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --surface: #181b1e;
      --surface-2: #202428;
      --surface-3: #292e33;
      --line: #343a40;
      --line-strong: #4a525a;
      --text: #f2f4f5;
      --muted: #9ba4ad;
      --green: #54c58b;
      --green-bg: #163326;
      --amber: #f0b45c;
      --red: #ef7777;
      --blue: #6eb4e8;
      --focus: #e8e8e8;
      --sidebar: 354px;
      --header: 64px;
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    button, input, select { font: inherit; }

    button {
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 5px;
      min-height: 34px;
      padding: 0 12px;
      cursor: pointer;
    }

    button:hover { background: var(--surface-3); border-color: var(--line-strong); }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    button:disabled { color: #666d73; cursor: default; background: #171a1c; }

    .app-header {
      height: var(--header);
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: #141719;
    }

    .brand { min-width: 210px; }
    .brand h1 { margin: 0; font-size: 18px; line-height: 1.15; letter-spacing: 0; }
    .brand-path {
      max-width: 460px;
      margin-top: 4px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .summary {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .stat {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 92px;
      padding: 7px 10px;
      border-left: 2px solid var(--line-strong);
    }
    .stat strong { font-size: 16px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .stat.visible { border-left-color: var(--green); }
    .stat.complete { border-left-color: var(--blue); }

    .header-actions { display: flex; gap: 8px; }

    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      height: calc(100vh - var(--header));
      min-height: 0;
      overflow: hidden;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      background: var(--surface);
      border-right: 1px solid var(--line);
    }

    .filters {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 10px;
    }

    .field-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    select, input[type="search"], input[type="number"] {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #111416;
      color: var(--text);
      padding: 0 10px;
    }

    .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--line);
      border-radius: 5px;
      overflow: hidden;
    }
    .segmented button { border: 0; border-right: 1px solid var(--line); border-radius: 0; padding: 0 6px; }
    .segmented button:last-child { border-right: 0; }
    .segmented button.active { background: #e7eaec; color: #111416; }

    .frame-toolbar {
      min-height: 41px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .frame-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: max-content;
      align-content: start;
      gap: 8px;
      scrollbar-color: var(--line-strong) transparent;
    }

    .frame-card {
      position: relative;
      min-width: 0;
      padding: 0;
      overflow: hidden;
      text-align: left;
      background: #111416;
      border: 1px solid var(--line);
      border-radius: 5px;
    }
    .frame-card:hover { border-color: #65707a; }
    .frame-card.selected { border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus); }
    .frame-card.incomplete { border-color: #6d4545; }

    .frame-thumb {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #090b0c;
    }

    .frame-card-footer {
      height: 31px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 0 8px;
      font-size: 11px;
    }
    .frame-id { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .visibility-dot { width: 7px; height: 7px; border-radius: 50%; background: #5b6268; flex: 0 0 auto; }
    .visibility-dot.visible { background: var(--green); }
    .frame-state { display: flex; align-items: center; gap: 5px; color: var(--muted); }

    .workspace {
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-color: var(--line-strong) transparent;
    }

    .workspace-inner { width: min(1500px, 100%); margin: 0 auto; padding: 16px 18px 28px; }

    .frame-nav {
      display: grid;
      grid-template-columns: auto auto minmax(180px, 1fr) 118px;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }
    .current-frame { min-width: 0; padding: 0 8px; }
    .current-frame strong { font-size: 16px; }
    .current-frame span { color: var(--muted); font-size: 12px; margin-left: 8px; }
    .jump-wrap { display: grid; grid-template-columns: 42px 1fr; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }

    .visual-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .visual-panel {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #090b0c;
    }
    .visual-panel-header {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
    }
    .visual-panel-header h2 { margin: 0; font-size: 13px; }
    .panel-meta { color: var(--muted); font-size: 11px; }

    .image-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #070809;
    }
    .image-stage img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: auto;
    }
    .image-stage .overlay-image { position: absolute; inset: 0; opacity: 0.55; }

    .target-marker {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }
    .target-marker::before, .target-marker::after {
      content: "";
      position: absolute;
      background: #fff;
    }
    .target-marker::before { width: 26px; height: 1px; left: -5px; top: 8px; }
    .target-marker::after { width: 1px; height: 26px; left: 8px; top: -5px; }
    .target-marker.hidden { display: none; }

    .opacity-control { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    input[type="range"] { accent-color: var(--amber); width: 90px; }

    .details-band {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      margin-top: 14px;
      border: 1px solid var(--line);
      background: var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .detail-group { min-width: 0; padding: 13px; background: var(--surface); }
    .detail-group h3 { margin: 0 0 11px; color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .detail-row { display: flex; justify-content: space-between; gap: 10px; margin: 7px 0; font-size: 12px; }
    .detail-row span:first-child { color: var(--muted); }
    .detail-row code { color: var(--text); text-align: right; overflow-wrap: anywhere; }

    .status-pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
    .status-pill.visible { color: var(--green); }
    .status-pill.hidden-target { color: var(--muted); }
    .status-pill.missing { color: var(--red); }

    details.raw-data { margin-top: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
    details.raw-data summary { cursor: pointer; padding: 12px 14px; color: var(--muted); font-size: 12px; }
    details.raw-data pre { margin: 0; padding: 0 14px 14px; overflow: auto; color: #cbd2d8; font-size: 11px; line-height: 1.55; }

    .empty, .loading, .error-message {
      grid-column: 1 / -1;
      padding: 36px 20px;
      color: var(--muted);
      text-align: center;
    }
    .error-message { color: var(--red); }

    @media (max-width: 1050px) {
      :root { --sidebar: 300px; }
      .summary .stat:nth-child(3) { display: none; }
      .visual-grid { grid-template-columns: 1fr; }
      .details-band { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .app-header { position: sticky; top: 0; z-index: 10; height: auto; min-height: 62px; flex-wrap: wrap; padding: 10px 12px; }
      .brand { flex: 1; }
      .summary { order: 3; flex: 0 0 100%; width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; overflow: visible; }
      .summary .stat:nth-child(3) { display: flex; }
      .summary .stat { min-width: 0; padding: 6px 7px; gap: 4px; }
      .summary .stat strong { font-size: 14px; }
      .summary .stat span { font-size: 10px; white-space: nowrap; }
      .app-shell { display: block; height: auto; overflow: visible; }
      .sidebar { height: 460px; border-right: 0; border-bottom: 1px solid var(--line); }
      .workspace { height: auto; overflow: visible; }
      .workspace-inner { padding: 12px; }
      .frame-nav { grid-template-columns: auto auto 1fr; }
      .jump-wrap { grid-column: 1 / -1; }
      .details-band { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>OpenSeek 数据检查</h1>
      <div class="brand-path" id="data-root">正在连接数据服务...</div>
    </div>
    <div class="summary" aria-label="数据统计">
      <div class="stat"><strong id="scene-count">-</strong><span>场景</span></div>
      <div class="stat"><strong id="frame-count">-</strong><span>帧</span></div>
      <div class="stat visible"><strong id="visible-count">-</strong><span>目标可见</span></div>
      <div class="stat complete"><strong id="complete-count">-</strong><span>数据完整</span></div>
    </div>
    <div class="header-actions">
      <button id="refresh-button" type="button" title="重新扫描数据目录">刷新数据</button>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="filters">
        <label>
          <span class="field-label">场景</span>
          <select id="scene-select"></select>
        </label>
        <div class="filter-row">
          <label>
            <span class="field-label">查找帧</span>
            <input id="frame-search" type="search" inputmode="numeric" placeholder="例如 56">
          </label>
          <label>
            <span class="field-label">数据状态</span>
            <select id="completeness-select">
              <option value="all">全部</option>
              <option value="complete">完整</option>
              <option value="missing">缺失文件</option>
            </select>
          </label>
        </div>
        <div>
          <span class="field-label">目标可见性</span>
          <div class="segmented" id="visibility-filter">
            <button type="button" data-value="all" class="active">全部</button>
            <button type="button" data-value="visible">可见</button>
            <button type="button" data-value="hidden">不可见</button>
          </div>
        </div>
      </div>
      <div class="frame-toolbar">
        <span id="filter-count">0 帧</span>
        <span id="visible-ratio">可见 0%</span>
      </div>
      <div class="frame-list" id="frame-list">
        <div class="loading">正在读取索引...</div>
      </div>
    </aside>

    <main class="workspace" id="workspace">
      <div class="workspace-inner">
        <div class="frame-nav">
          <button id="previous-button" type="button" title="上一帧">上一帧</button>
          <button id="next-button" type="button" title="下一帧">下一帧</button>
          <div class="current-frame">
            <strong id="current-frame-title">未选择帧</strong>
            <span id="current-frame-position"></span>
          </div>
          <label class="jump-wrap">
            <span>跳转</span>
            <input id="jump-input" type="number" min="0" placeholder="帧号">
          </label>
        </div>

        <div class="visual-grid">
          <section class="visual-panel">
            <div class="visual-panel-header">
              <h2>RGB</h2>
              <span class="panel-meta" id="rgb-meta">-</span>
            </div>
            <div class="image-stage">
              <img id="rgb-image" alt="当前帧 RGB">
              <span class="target-marker hidden" id="rgb-marker"></span>
            </div>
          </section>

          <section class="visual-panel">
            <div class="visual-panel-header">
              <h2>Depth</h2>
              <span class="panel-meta" id="depth-meta">-</span>
            </div>
            <div class="image-stage">
              <img id="depth-image" alt="当前帧深度图">
            </div>
          </section>

          <section class="visual-panel">
            <div class="visual-panel-header">
              <h2>PEARL 热力图</h2>
              <span class="panel-meta" id="semantic-meta">绝对概率 0.0 - 1.0</span>
            </div>
            <div class="image-stage">
              <img id="semantic-image" alt="当前帧 PEARL 热力图">
            </div>
          </section>

          <section class="visual-panel">
            <div class="visual-panel-header">
              <h2>RGB + PEARL</h2>
              <label class="opacity-control">
                <span>透明度</span>
                <input id="opacity-input" type="range" min="0" max="100" value="55">
              </label>
            </div>
            <div class="image-stage">
              <img id="fusion-rgb-image" alt="当前帧 RGB">
              <img id="fusion-semantic-image" class="overlay-image" alt="PEARL 叠加图">
              <span class="target-marker hidden" id="fusion-marker"></span>
            </div>
          </section>
        </div>

        <section class="details-band" id="details-band">
          <div class="detail-group">
            <h3>目标</h3>
            <div class="detail-row"><span>状态</span><code id="detail-visible">-</code></div>
            <div class="detail-row"><span>Prompt</span><code id="detail-prompt">-</code></div>
            <div class="detail-row"><span>置信度</span><code id="detail-confidence">-</code></div>
            <div class="detail-row"><span>像素</span><code id="detail-pixel">-</code></div>
          </div>
          <div class="detail-group">
            <h3>相机与载体</h3>
            <div class="detail-row"><span>位置</span><code id="detail-position">-</code></div>
            <div class="detail-row"><span>Yaw</span><code id="detail-yaw">-</code></div>
            <div class="detail-row"><span>目标/相机</span><code id="detail-camera">-</code></div>
            <div class="detail-row"><span>目标/世界</span><code id="detail-world">-</code></div>
          </div>
          <div class="detail-group">
            <h3>文件</h3>
            <div class="detail-row"><span>RGB</span><code id="detail-rgb">-</code></div>
            <div class="detail-row"><span>Depth</span><code id="detail-depth">-</code></div>
            <div class="detail-row"><span>PEARL</span><code id="detail-semantic">-</code></div>
            <div class="detail-row"><span>同步状态</span><code id="detail-complete">-</code></div>
          </div>
          <div class="detail-group">
            <h3>场景</h3>
            <div class="detail-row"><span>名称</span><code id="detail-scene">-</code></div>
            <div class="detail-row"><span>tree.ply</span><code id="detail-tree">-</code></div>
            <div class="detail-row"><span>target.ply</span><code id="detail-target">-</code></div>
            <div class="detail-row"><span>Depth 范围</span><code id="detail-far">-</code></div>
          </div>
        </section>

        <details class="raw-data">
          <summary>data.toml 当前记录</summary>
          <pre id="raw-json">{}</pre>
        </details>
      </div>
    </main>
  </div>

  <script>
    const state = {
      catalog: null,
      sceneName: "all",
      visibility: "all",
      completeness: "all",
      search: "",
      frames: [],
      selectedKey: null,
    };
    const ASSET_VERSION = "absolute-probability-v2";

    const elements = Object.fromEntries(
      Array.from(document.querySelectorAll("[id]")).map((element) => [element.id, element])
    );

    function assetUrl(frame, kind) {
      const query = new URLSearchParams({
        scene: frame.scene,
        frame: frame.id,
        kind,
        version: ASSET_VERSION,
      });
      return `/api/asset?${query.toString()}`;
    }

    function frameKey(frame) {
      return `${frame.scene}:${frame.id}`;
    }

    function allFrames() {
      if (!state.catalog) return [];
      return state.catalog.scenes.flatMap((scene) => scene.frames);
    }

    async function loadCatalog(refresh = false) {
      elements["refresh-button"].disabled = true;
      elements["refresh-button"].textContent = "扫描中";
      try {
        const response = await fetch(`/api/index${refresh ? "?refresh=1" : ""}`);
        if (!response.ok) throw new Error(await response.text());
        state.catalog = await response.json();
        renderCatalog();
      } catch (error) {
        elements["frame-list"].innerHTML = `<div class="error-message">${escapeHtml(error.message)}</div>`;
      } finally {
        elements["refresh-button"].disabled = false;
        elements["refresh-button"].textContent = "刷新数据";
      }
    }

    function renderCatalog() {
      const catalog = state.catalog;
      elements["data-root"].textContent = catalog.root;
      elements["data-root"].title = catalog.root;
      elements["scene-count"].textContent = catalog.sceneCount;
      elements["frame-count"].textContent = catalog.frameCount;
      elements["visible-count"].textContent = catalog.visibleCount;
      elements["complete-count"].textContent = catalog.completeCount;

      const previousScene = state.sceneName;
      elements["scene-select"].replaceChildren();
      elements["scene-select"].append(new Option(`全部场景 (${catalog.frameCount})`, "all"));
      for (const scene of catalog.scenes) {
        elements["scene-select"].append(
          new Option(`${scene.name} (${scene.frameCount} 帧 / ${scene.visibleCount} 可见)`, scene.name)
        );
      }
      state.sceneName = Array.from(elements["scene-select"].options).some((option) => option.value === previousScene)
        ? previousScene : "all";
      elements["scene-select"].value = state.sceneName;
      applyFilters();
    }

    function applyFilters() {
      const query = state.search.trim().toLowerCase();
      state.frames = allFrames().filter((frame) => {
        if (state.sceneName !== "all" && frame.scene !== state.sceneName) return false;
        if (state.visibility === "visible" && !frame.visible) return false;
        if (state.visibility === "hidden" && frame.visible) return false;
        if (state.completeness === "complete" && !frame.complete) return false;
        if (state.completeness === "missing" && frame.complete) return false;
        if (query && !frame.id.toLowerCase().includes(query) && !frame.scene.toLowerCase().includes(query)) return false;
        return true;
      });

      const visible = state.frames.filter((frame) => frame.visible).length;
      elements["filter-count"].textContent = `${state.frames.length} 帧`;
      elements["visible-ratio"].textContent = `可见 ${state.frames.length ? Math.round(visible / state.frames.length * 100) : 0}%`;
      renderFrameList();

      const selectedStillVisible = state.frames.some((frame) => frameKey(frame) === state.selectedKey);
      if (!selectedStillVisible) selectFrame(state.frames[0] || null, false);
      else updateNavigation();
    }

    function renderFrameList() {
      const list = elements["frame-list"];
      list.replaceChildren();
      if (!state.frames.length) {
        list.innerHTML = '<div class="empty">没有符合条件的帧</div>';
        return;
      }

      const fragment = document.createDocumentFragment();
      for (const frame of state.frames) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = `frame-card${frame.complete ? "" : " incomplete"}`;
        card.dataset.key = frameKey(frame);
        card.title = `${frame.scene} / Frame ${frame.id}`;
        card.addEventListener("click", () => selectFrame(frame));

        const image = document.createElement("img");
        image.className = "frame-thumb";
        image.loading = "lazy";
        image.alt = `${frame.scene} 帧 ${frame.id}`;
        if (frame.available.rgb) image.src = assetUrl(frame, "thumb");

        const footer = document.createElement("div");
        footer.className = "frame-card-footer";
        const id = document.createElement("span");
        id.className = "frame-id";
        id.textContent = `${frame.scene.replace("Scene_", "S")} / ${frame.id}`;
        const status = document.createElement("span");
        status.className = "frame-state";
        status.innerHTML = `<span class="visibility-dot${frame.visible ? " visible" : ""}"></span>${frame.visible ? "可见" : "不可见"}`;
        footer.append(id, status);
        card.append(image, footer);
        fragment.append(card);
      }
      list.append(fragment);
      updateSelectedCard();
    }

    function selectFrame(frame, scroll = true) {
      if (!frame) {
        state.selectedKey = null;
        elements["current-frame-title"].textContent = "未选择帧";
        clearImages();
        updateNavigation();
        return;
      }
      state.selectedKey = frameKey(frame);
      renderSelectedFrame(frame);
      if (scroll && window.innerWidth > 760) {
        elements["workspace"].scrollTo({ top: 0, behavior: "auto" });
      }
      updateSelectedCard(scroll);
      updateNavigation();
    }

    function selectedFrame() {
      return allFrames().find((frame) => frameKey(frame) === state.selectedKey) || null;
    }

    function renderSelectedFrame(frame) {
      const scene = state.catalog.scenes.find((item) => item.name === frame.scene);
      elements["current-frame-title"].textContent = `${frame.scene} / Frame ${frame.id}`;
      elements["jump-input"].value = frame.id;

      setImage(elements["rgb-image"], frame.available.rgb ? assetUrl(frame, "rgb") : "");
      setImage(elements["fusion-rgb-image"], frame.available.rgb ? assetUrl(frame, "rgb") : "");
      setImage(elements["depth-image"], frame.available.depth ? assetUrl(frame, "depth") : "");
      setImage(elements["semantic-image"], frame.available.semantic ? assetUrl(frame, "semantic") : "");
      setImage(elements["fusion-semantic-image"], frame.available.semantic ? assetUrl(frame, "semantic_overlay") : "");

      const size = frame.targetImageSize || [];
      elements["rgb-meta"].textContent = size[0] && size[1] ? `${size[0]} x ${size[1]} 标注坐标` : "无标注尺寸";
      elements["depth-meta"].textContent = scene.camera.farClip ? `0 - ${formatNumber(scene.camera.farClip, 1)} m` : "范围未知";
      elements["semantic-meta"].textContent = frame.available.semantic ? "读取绝对概率..." : "文件缺失";
      if (frame.available.semantic) loadFrameStats(frame);
      updateMarker(elements["rgb-marker"], frame);
      updateMarker(elements["fusion-marker"], frame);

      const filteredIndex = state.frames.findIndex((item) => frameKey(item) === state.selectedKey);
      elements["current-frame-position"].textContent = filteredIndex >= 0 ? `筛选结果 ${filteredIndex + 1} / ${state.frames.length}` : "";
      setStatus("detail-visible", frame.visible ? "目标可见" : "目标不可见", frame.visible ? "visible" : "hidden-target");
      elements["detail-prompt"].textContent = frame.prompt || "-";
      elements["detail-confidence"].textContent = formatNumber(frame.confidence, 3);
      elements["detail-pixel"].textContent = formatVector(frame.targetPixel, 1);
      elements["detail-position"].textContent = formatVector(frame.position, 2);
      elements["detail-yaw"].textContent = `${formatNumber(frame.yaw, 2)} deg`;
      elements["detail-camera"].textContent = formatVector(frame.targetCamera, 2);
      elements["detail-world"].textContent = formatVector(frame.targetWorld, 2);
      setFileStatus("detail-rgb", frame.available.rgb);
      setFileStatus("detail-depth", frame.available.depth);
      setFileStatus("detail-semantic", frame.available.semantic);
      setStatus("detail-complete", frame.complete ? "完整" : "缺失", frame.complete ? "visible" : "missing");
      elements["detail-scene"].textContent = frame.scene;
      setFileStatus("detail-tree", scene.hasTreePly);
      setFileStatus("detail-target", scene.hasTargetPly);
      elements["detail-far"].textContent = scene.camera.farClip ? `${formatNumber(scene.camera.farClip, 1)} m` : "-";
      elements["raw-json"].textContent = JSON.stringify(frame.metadata, null, 2);
    }

    function setImage(image, src) {
      image.classList.toggle("missing", !src);
      if (src) image.src = src;
      else image.removeAttribute("src");
    }

    async function loadFrameStats(frame) {
      const key = frameKey(frame);
      try {
        const query = new URLSearchParams({ scene: frame.scene, frame: frame.id });
        const response = await fetch(`/api/frame-stats?${query.toString()}`);
        if (!response.ok) throw new Error(await response.text());
        const payload = await response.json();
        if (state.selectedKey !== key) return;
        const stats = payload.semantic;
        elements["semantic-meta"].textContent =
          `min ${formatProbability(stats.min)}  max ${formatProbability(stats.max)}  mean ${formatProbability(stats.mean)}`;
      } catch (error) {
        if (state.selectedKey === key) elements["semantic-meta"].textContent = "数值读取失败";
      }
    }

    function clearImages() {
      for (const id of ["rgb-image", "fusion-rgb-image", "depth-image", "semantic-image", "fusion-semantic-image"]) {
        elements[id].removeAttribute("src");
      }
      elements["rgb-marker"].classList.add("hidden");
      elements["fusion-marker"].classList.add("hidden");
    }

    function updateMarker(marker, frame) {
      const [x, y] = frame.targetPixel || [];
      const [width, height] = frame.targetImageSize || [];
      const inBounds = frame.visible && Number.isFinite(x) && Number.isFinite(y) && width > 0 && height > 0 && x >= 0 && x <= width && y >= 0 && y <= height;
      marker.classList.toggle("hidden", !inBounds);
      if (!inBounds) return;
      marker.style.left = `${x / width * 100}%`;
      marker.style.top = `${y / height * 100}%`;
    }

    function setFileStatus(id, available) {
      setStatus(id, available ? "存在" : "缺失", available ? "visible" : "missing");
    }

    function setStatus(id, text, className) {
      elements[id].innerHTML = `<span class="status-pill ${className}">${text}</span>`;
    }

    function updateSelectedCard(scroll = false) {
      for (const card of elements["frame-list"].querySelectorAll(".frame-card")) {
        card.classList.toggle("selected", card.dataset.key === state.selectedKey);
      }
      if (scroll) {
        const selected = elements["frame-list"].querySelector(".frame-card.selected");
        selected?.scrollIntoView({ block: "nearest" });
      }
    }

    function updateNavigation() {
      const index = state.frames.findIndex((frame) => frameKey(frame) === state.selectedKey);
      elements["previous-button"].disabled = index <= 0;
      elements["next-button"].disabled = index < 0 || index >= state.frames.length - 1;
    }

    function moveSelection(offset) {
      if (!state.frames.length) return;
      const index = state.frames.findIndex((frame) => frameKey(frame) === state.selectedKey);
      const nextIndex = Math.max(0, Math.min(state.frames.length - 1, (index < 0 ? 0 : index) + offset));
      selectFrame(state.frames[nextIndex]);
    }

    function jumpToFrame() {
      const value = elements["jump-input"].value.trim();
      if (!value) return;
      const sameScene = selectedFrame()?.scene;
      const target = state.frames.find((frame) => frame.id === value && (!sameScene || frame.scene === sameScene))
        || state.frames.find((frame) => frame.id === value);
      if (target) selectFrame(target);
    }

    function formatNumber(value, digits) {
      const number = Number(value);
      return Number.isFinite(number) ? number.toFixed(digits) : "-";
    }

    function formatProbability(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "-";
      if (number !== 0 && Math.abs(number) < 0.001) return number.toExponential(2);
      return number.toFixed(4);
    }

    function formatVector(value, digits) {
      if (!Array.isArray(value) || !value.length) return "-";
      return `[${value.map((item) => formatNumber(item, digits)).join(", ")}]`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[character]);
    }

    elements["scene-select"].addEventListener("change", (event) => {
      state.sceneName = event.target.value;
      applyFilters();
    });
    elements["frame-search"].addEventListener("input", (event) => {
      state.search = event.target.value;
      applyFilters();
    });
    elements["completeness-select"].addEventListener("change", (event) => {
      state.completeness = event.target.value;
      applyFilters();
    });
    elements["visibility-filter"].addEventListener("click", (event) => {
      const button = event.target.closest("button[data-value]");
      if (!button) return;
      state.visibility = button.dataset.value;
      for (const item of elements["visibility-filter"].querySelectorAll("button")) {
        item.classList.toggle("active", item === button);
      }
      applyFilters();
    });
    elements["previous-button"].addEventListener("click", () => moveSelection(-1));
    elements["next-button"].addEventListener("click", () => moveSelection(1));
    elements["refresh-button"].addEventListener("click", () => loadCatalog(true));
    elements["jump-input"].addEventListener("change", jumpToFrame);
    elements["jump-input"].addEventListener("keydown", (event) => {
      if (event.key === "Enter") jumpToFrame();
    });
    elements["opacity-input"].addEventListener("input", (event) => {
      elements["fusion-semantic-image"].style.opacity = String(Number(event.target.value) / 100);
    });
    document.addEventListener("keydown", (event) => {
      if (event.target.matches("input, select, button")) return;
      if (event.key === "ArrowLeft") moveSelection(-1);
      if (event.key === "ArrowRight") moveSelection(1);
      if (event.key === "Home" && state.frames.length) selectFrame(state.frames[0]);
      if (event.key === "End" && state.frames.length) selectFrame(state.frames[state.frames.length - 1]);
    });

    loadCatalog();
  </script>
</body>
</html>
