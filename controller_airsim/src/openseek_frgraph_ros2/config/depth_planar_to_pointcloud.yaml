depth_planar_to_pointcloud:
  ros__parameters:
    depth_topic: /camera/depth/image
    camera_info_topic: /camera/depth/camera_info
    pointcloud_topic: /frgraph/points
    free_ray_topic: /frgraph/free_rays
    output_frame: base_link
    max_range_m: 20.0
    free_ray_pixel_stride: 4
    # Must match openseek_airsim_renderer/config/renderer.yaml. Depth samples
    # are expressed from the camera center, while EPIC consumes body-frame
    # points and measures clearance from the vehicle origin.
    camera_translation_flu.x: 0.5
    camera_translation_flu.y: 0.0
    camera_translation_flu.z: -0.1
