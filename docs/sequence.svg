<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1370" viewBox="0 0 1800 1370">
  <defs>
    <marker id="s-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#168a50"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #19232c; letter-spacing: 0; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #5c6872; }
      .panel { font-size: 19px; font-weight: 700; }
      .head { font-size: 15px; font-weight: 700; }
      .label { font-size: 14px; fill: #52616d; }
      .tiny { font-size: 12px; fill: #65727c; }
      .edge { fill: none; stroke: #75838d; stroke-width: 1.8; }
      .route { fill: none; stroke: #d97706; stroke-width: 3.5; }
      .traj { fill: none; stroke: #1ca55c; stroke-width: 5; marker-end: url(#s-green); }
      .gray { fill: #cfd5da; stroke: #74818a; stroke-width: 1.2; }
      .green { fill: #31b96b; stroke: #137c45; stroke-width: 1.2; }
      .warm1 { fill: #e5bd59; stroke: #9a7620; stroke-width: 1.3; }
      .warm2 { fill: #ef7b38; stroke: #a94a18; stroke-width: 1.3; }
      .hot { fill: #d83c48; stroke: #922630; stroke-width: 1.5; }
      .avoid { fill: #a45bd4; stroke: #6d2998; stroke-width: 1.5; }
    </style>
    <symbol id="map" viewBox="0 0 500 220">
      <rect x="1" y="1" width="498" height="218" rx="4" fill="#f6f8f7" stroke="#8b9891"/>
      <g class="gray">
        <circle cx="40" cy="28" r="6"/><circle cx="110" cy="28" r="6"/><circle cx="180" cy="28" r="6"/><circle cx="320" cy="28" r="6"/><circle cx="390" cy="28" r="6"/><circle cx="460" cy="28" r="6"/>
        <circle cx="460" cy="72" r="6"/><circle cx="390" cy="72" r="6"/><circle cx="320" cy="72" r="6"/><circle cx="180" cy="72" r="6"/><circle cx="110" cy="72" r="6"/><circle cx="40" cy="72" r="6"/>
        <circle cx="40" cy="116" r="6"/><circle cx="110" cy="116" r="6"/><circle cx="180" cy="116" r="6"/><circle cx="320" cy="116" r="6"/><circle cx="390" cy="116" r="6"/><circle cx="460" cy="116" r="6"/>
        <circle cx="460" cy="160" r="6"/><circle cx="390" cy="160" r="6"/><circle cx="320" cy="160" r="6"/><circle cx="180" cy="160" r="6"/><circle cx="110" cy="160" r="6"/><circle cx="40" cy="160" r="6"/>
        <circle cx="40" cy="204" r="6"/><circle cx="110" cy="204" r="6"/><circle cx="180" cy="204" r="6"/><circle cx="320" cy="204" r="6"/><circle cx="390" cy="204" r="6"/><circle cx="460" cy="204" r="6"/>
      </g>
      <rect x="203" y="47" width="114" height="130" rx="7" fill="#efd9da" stroke="#c47479" stroke-width="2" stroke-dasharray="7 5"/>
      <rect x="222" y="66" width="76" height="92" rx="4" fill="#59656e" stroke="#354049"/><text x="260" y="116" text-anchor="middle" font-size="12" fill="#fff">障碍物</text>
    </symbol>
    <symbol id="avoid-nodes" viewBox="0 0 500 220">
      <circle cx="194" cy="38" r="7" class="avoid"/><circle cx="326" cy="38" r="7" class="avoid"/><circle cx="194" cy="186" r="7" class="avoid"/><circle cx="326" cy="186" r="7" class="avoid"/>
    </symbol>
    <symbol id="graph" viewBox="0 0 500 220">
      <g class="edge"><path d="M40 28H180M320 28H460M40 72H180M320 72H460M40 116H180M320 116H460M40 160H180M320 160H460M40 204H460"/><path d="M40 28V204M110 28V204M180 28V204M320 28V204M390 28V204M460 28V204"/><path d="M180 28L194 38L326 38L320 28M180 204L194 186L326 186L320 204M180 72L194 38M180 160L194 186M320 72L326 38M320 160L326 186M40 204L110 160M390 160L460 204"/></g>
      <use href="#avoid-nodes" width="500" height="220"/>
    </symbol>
    <symbol id="target" viewBox="0 0 500 220">
      <path d="M416 35L438 18L460 35Z" fill="#a91f2b" stroke="#7c1720"/><rect x="421" y="35" width="34" height="31" fill="#d84a47" stroke="#8d2528"/><rect x="434" y="47" width="9" height="19" fill="#74242a"/><text x="438" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="#a8202c">red building</text>
    </symbol>
  </defs>

  <rect width="1800" height="1370" fill="#f8fafc"/>
  <text x="900" y="48" text-anchor="middle" class="title">实时语义搜索：节点、路径与局部轨迹的连续更新</text>
  <text x="900" y="78" text-anchor="middle" class="subtitle">均匀基础节点与膨胀边界避障节点共同构图；三类节点得分驱动实时 TSP 与 R_plan 局部规划</text>

  <!-- Row 1 -->
  <g transform="translate(40,110)">
    <rect width="540" height="340" rx="7" fill="#fff" stroke="#aeb8bf" stroke-width="2"/>
    <text x="22" y="34" class="panel">(a) 建立持久全局基础节点</text><text x="518" y="34" text-anchor="end" class="tiny">指定区域</text>
    <g transform="translate(20,58)"><use href="#map" width="500" height="220"/></g>
    <text x="270" y="300" text-anchor="middle" class="label">已知区域预生成；未知区域首次进入时生成</text><text x="270" y="322" text-anchor="middle" class="tiny">基础节点最小间距 ≥ R_plan，访问历史全局保留</text>
  </g>

  <g transform="translate(630,110)">
    <rect width="540" height="340" rx="7" fill="#fff" stroke="#d08a63" stroke-width="2"/>
    <text x="22" y="34" class="panel">(b) 膨胀障碍并生成避障节点</text><text x="518" y="34" text-anchor="end" class="tiny">几何约束</text>
    <g transform="translate(20,58)"><use href="#map" width="500" height="220"/><path d="M203 47H317V177H203Z" fill="none" stroke="#d6555b" stroke-width="3" stroke-dasharray="8 5"/><use href="#avoid-nodes" width="500" height="220"/></g>
    <text x="270" y="308" text-anchor="middle" class="label">在膨胀边界外生成紫色避障节点，并删除冲突基础节点</text>
  </g>

  <g transform="translate(1220,110)">
    <rect width="540" height="340" rx="7" fill="#fff" stroke="#d08a63" stroke-width="2"/>
    <text x="22" y="34" class="panel">(c) 建立无碰撞可见图</text><text x="518" y="34" text-anchor="end" class="tiny">全局避障</text>
    <g transform="translate(20,58)"><use href="#map" width="500" height="220"/><use href="#graph" width="500" height="220"/></g>
    <text x="270" y="308" text-anchor="middle" class="label">避障节点连接基础节点；所有边均通过无碰撞可见性检查</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(40,500)">
    <rect width="540" height="340" rx="7" fill="#fff" stroke="#3b9962" stroke-width="2"/>
    <text x="22" y="34" class="panel">(d) 更新随平台移动的活动子图</text><text x="518" y="34" text-anchor="end" class="tiny">局部缓存</text>
    <g transform="translate(20,58)"><use href="#map" width="500" height="220"/><use href="#graph" width="500" height="220" opacity="0.38"/><g class="green"><circle cx="40" cy="204" r="8"/><circle cx="110" cy="160" r="8"/><circle cx="180" cy="180" r="10"/></g><circle cx="180" cy="180" r="54" fill="none" stroke="#168a50" stroke-width="2" stroke-dasharray="5 4"/><circle cx="250" cy="204" r="7" fill="#fff" stroke="#168a50" stroke-width="2"/><path d="M243 204H257M250 197V211" stroke="#168a50" stroke-width="2"/><path d="M110 72l14 14M124 72l-14 14" stroke="#c8323c" stroke-width="3"/><text x="233" y="185" class="tiny" fill="#168a50">≥ R_plan</text></g>
    <text x="270" y="300" text-anchor="middle" class="label">活动范围内增删缓存节点、避障节点与可见边</text><text x="270" y="322" text-anchor="middle" class="tiny">移出活动子图不删除持久图中的访问历史</text>
  </g>

  <g transform="translate(1220,500)">
    <rect width="540" height="340" rx="7" fill="#fff" stroke="#3b9962" stroke-width="2"/>
    <text x="22" y="34" class="panel">(f) 更新节点三类得分</text><text x="518" y="34" text-anchor="end" class="tiny">慢系统</text>
    <g transform="translate(20,58)"><use href="#map" width="500" height="220"/><use href="#graph" width="500" height="220" opacity="0.3"/><circle cx="180" cy="180" r="10" fill="#2767d4" stroke="#17498f"/><circle cx="110" cy="160" r="9" fill="#7aa7d7"/><circle cx="180" cy="204" r="9" class="warm1"/><circle cx="220" cy="204" r="9" class="warm2"/><circle cx="250" cy="204" r="11" class="hot"/><g transform="translate(18,12)"><rect width="126" height="66" rx="4" fill="#91b9d8" stroke="#6d8497"/><rect y="41" width="126" height="25" fill="#71935e"/><g opacity="0.55"><rect x="0" width="31.5" height="22" fill="#477fc0"/><rect x="31.5" y="22" width="31.5" height="22" fill="#6d9fd1"/><rect x="63" y="22" width="31.5" height="22" fill="#ef7543"/><rect x="94.5" width="31.5" height="22" fill="#dc3d45"/></g><path d="M31.5 0V66M63 0V66M94.5 0V66M0 22H126M0 44H126" stroke="#fff" opacity="0.7"/></g></g>
    <text x="270" y="294" text-anchor="middle" class="label">安全硬筛选；探索项降级或排除已访问节点</text><text x="270" y="314" text-anchor="middle" class="tiny">有效 Depth：语义热区回投到最近活动节点</text><text x="270" y="332" text-anchor="middle" class="tiny">无有效 Depth：不更新世界节点，仅把热力图送快系统</text>
  </g>

  <g transform="translate(630,500)">
    <rect width="540" height="340" rx="7" fill="#fff" stroke="#d39145" stroke-width="2"/>
    <text x="22" y="34" class="panel">(e) 双阈值判定语义状态</text><text x="518" y="34" text-anchor="end" class="tiny">滞回 / 连续帧确认</text>
    <g transform="translate(20,64)">
      <g><rect width="150" height="196" rx="6" fill="#f5f7f8" stroke="#aeb8bf"/><text x="75" y="30" text-anchor="middle" class="head">无语义</text><g transform="translate(28,78)" class="gray"><circle cx="0" cy="0" r="7"/><circle cx="47" cy="0" r="7"/><circle cx="94" cy="0" r="7"/><circle cx="94" cy="48" r="7"/><circle cx="47" cy="48" r="7"/><circle cx="0" cy="48" r="7"/></g><path d="M28 126H122" class="route"/><text x="75" y="154" text-anchor="middle" class="tiny">s &lt; τ_low</text><text x="75" y="174" text-anchor="middle" class="tiny">覆盖 TSP</text></g>
      <g transform="translate(175,0)"><rect width="150" height="196" rx="6" fill="#fff3df" stroke="#d39145"/><text x="75" y="30" text-anchor="middle" class="head">弱语义</text><circle cx="32" cy="91" r="8" class="warm1"/><circle cx="75" cy="91" r="9" class="warm2"/><circle cx="118" cy="91" r="11" class="hot"/><path d="M32 126L118 91" class="route"/><text x="75" y="154" text-anchor="middle" class="tiny">τ_low ≤ s &lt; τ_confirm</text><text x="75" y="174" text-anchor="middle" class="tiny">最高语义节点置前</text></g>
      <g transform="translate(350,0)"><rect width="150" height="196" rx="6" fill="#e8f7ed" stroke="#3b9962"/><text x="75" y="30" text-anchor="middle" class="head">明确语义</text><use href="#target" x="0" y="35" width="150" height="90"/><g opacity="0.55"><rect x="20" y="70" width="35" height="28" fill="#477fc0"/><rect x="55" y="70" width="35" height="28" fill="#ef7b38"/><rect x="90" y="70" width="35" height="28" fill="#d83c48"/></g><text x="75" y="154" text-anchor="middle" class="tiny">s ≥ τ_confirm</text><text x="75" y="174" text-anchor="middle" class="tiny">视觉 signed map 接管</text></g>
    </g>
    <text x="270" y="319" text-anchor="middle" class="tiny">状态可随新观测在三者之间实时切换</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(40,890)">
    <rect width="540" height="340" rx="7" fill="#fff" stroke="#d39145" stroke-width="2"/>
    <text x="22" y="34" class="panel">(g) 编码 signed 引力斥力图</text><text x="518" y="34" text-anchor="end" class="tiny">慢 → 快，固定 −1…+1</text>
    <g transform="translate(20,58)"><use href="#map" width="500" height="220"/><use href="#graph" width="500" height="220" opacity="0.3"/><circle cx="250" cy="204" r="62" fill="#d83c48" fill-opacity="0.17"/><circle cx="250" cy="204" r="34" fill="#ef573f" fill-opacity="0.2"/><circle cx="180" cy="116" r="58" fill="#477fc0" fill-opacity="0.18"/><circle cx="180" cy="116" r="30" fill="#326db3" fill-opacity="0.2"/><circle cx="180" cy="180" r="10" fill="#2767d4" stroke="#17498f"/><circle cx="250" cy="204" r="10" class="hot"/><circle cx="320" cy="204" r="8" class="warm2"/><rect x="320" y="20" width="160" height="74" rx="5" fill="#fff" stroke="#d39145"/><text x="400" y="43" text-anchor="middle" class="tiny">无：覆盖节点变暖</text><text x="400" y="63" text-anchor="middle" class="tiny">弱：最高语义节点变暖</text><text x="400" y="83" text-anchor="middle" class="tiny">明确：直接使用视觉图</text></g>
    <text x="270" y="300" text-anchor="middle" class="label">暖色表示吸引；冷色表示已访问、不可行或语义排斥</text><text x="270" y="322" text-anchor="middle" class="tiny">三种语义状态统一编码为同一种输入图</text>
  </g>

  <g transform="translate(630,890)">
    <rect width="540" height="340" rx="7" fill="#fff" stroke="#4778b7" stroke-width="2"/>
    <text x="22" y="34" class="panel">(h) 快系统生成 R_plan 内轨迹</text><text x="518" y="34" text-anchor="end" class="tiny">高频 Depth 避障</text>
    <g transform="translate(20,58)"><use href="#map" width="500" height="220" opacity="0.85"/><use href="#graph" width="500" height="220" opacity="0.2"/><circle cx="180" cy="180" r="80" fill="#e8f7ed" fill-opacity="0.22" stroke="#c45a08" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="250" cy="204" r="62" fill="#d83c48" fill-opacity="0.17"/><circle cx="214" cy="145" r="56" fill="#477fc0" fill-opacity="0.2"/><g stroke="#54c98a" stroke-width="1.8"><path d="M180 180L180 100M180 180L240 136M180 180L260 180M180 180L250 204M180 180L120 136"/></g><path d="M180 180C193 218 227 222 250 204" class="traj"/><circle cx="180" cy="180" r="12" fill="#07966a" stroke="#075b49" stroke-width="2.5"/><circle cx="250" cy="204" r="10" class="hot"/><text x="260" y="112" class="tiny" fill="#b44f08">R_plan</text></g>
    <text x="270" y="300" text-anchor="middle" class="label">快系统读取 Depth + signed 图 + state 预测短轨迹</text><text x="270" y="322" text-anchor="middle" class="tiny">暖区吸引、冷区与 Depth 障碍共同排斥</text>
  </g>

  <g transform="translate(1220,890)">
    <rect width="540" height="340" rx="7" fill="#fff" stroke="#3b9962" stroke-width="2"/>
    <text x="22" y="34" class="panel">(i) 执行短轨迹并反馈</text><text x="518" y="34" text-anchor="end" class="tiny">返回 (d)</text>
    <g transform="translate(20,58)"><use href="#map" width="500" height="220"/><use href="#graph" width="500" height="220" opacity="0.35"/><g class="green"><circle cx="40" cy="204" r="8"/><circle cx="110" cy="160" r="8"/><circle cx="180" cy="180" r="8"/><circle cx="250" cy="204" r="12"/></g><circle cx="250" cy="204" r="58" fill="none" stroke="#168a50" stroke-width="2" stroke-dasharray="5 4"/><circle cx="320" cy="204" r="7" fill="#fff" stroke="#168a50" stroke-width="2"/><path d="M313 204H327M320 197V211" stroke="#168a50" stroke-width="2"/><text x="300" y="181" class="tiny" fill="#168a50">下一圈 ≥ R_plan</text></g>
    <text x="270" y="300" text-anchor="middle" class="label">机器人移动到本次终点，快系统立即继续规划</text><text x="270" y="322" text-anchor="middle" class="tiny">位姿和新观测异步反馈给慢系统，重新执行 (d)–(g)</text>
  </g>

  <path d="M1490 1230V1300H310V1230" fill="none" stroke="#168a50" stroke-width="3" marker-end="url(#s-green)"/>
  <text x="900" y="1291" text-anchor="middle" class="label" fill="#168a50">闭环顺序：(d) 活动图更新 → (e) 三态判断 → (f) 节点更新 → (g) signed 图 → (h) 局部轨迹 → (i) 执行反馈</text>
  <g transform="translate(95,1340)"><circle cx="0" cy="0" r="7" class="gray"/><text x="16" y="5" class="tiny">基础节点</text><circle cx="105" cy="0" r="7" class="avoid"/><text x="121" y="5" class="tiny">膨胀边界避障节点</text><circle cx="285" cy="0" r="7" class="green"/><text x="301" y="5" class="tiny">已访问</text><circle cx="390" cy="0" r="8" class="hot"/><text x="408" y="5" class="tiny">高语义得分</text><path d="M540 0H600" class="route"/><text x="616" y="5" class="tiny">节点级全局路径</text><circle cx="780" cy="0" r="25" fill="none" stroke="#c45a08" stroke-width="2" stroke-dasharray="5 4"/><text x="815" y="5" class="tiny">R_plan</text><path d="M900 6C922 -12 947 15 975 0" class="traj"/><text x="995" y="5" class="tiny">局部短轨迹</text></g>
</svg>
