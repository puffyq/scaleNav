<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040">
  <defs>
    <marker id="wf-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#596773"/></marker>
    <marker id="wf-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#168a50"/></marker>
    <marker id="wf-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#2767d4"/></marker>
    <marker id="wf-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#d97706"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #19232c; letter-spacing: 0; }
      .title { font-size: 34px; font-weight: 700; }.subtitle { font-size: 17px; fill: #5c6872; }
      .lane { font-size: 22px; font-weight: 700; }.head { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; fill: #52616d; }.tiny { font-size: 12px; fill: #65727c; }
      .flow { fill: none; stroke: #596773; stroke-width: 3; marker-end: url(#wf-gray); }
      .slow { fill: none; stroke: #168a50; stroke-width: 3; marker-end: url(#wf-green); }
      .fast { fill: none; stroke: #2767d4; stroke-width: 3; marker-end: url(#wf-blue); }
      .gray { fill: #cfd5da; stroke: #74818a; stroke-width: 1.2; }.green { fill: #31b96b; stroke: #137c45; stroke-width: 1.2; }
      .avoid { fill: #a45bd4; stroke: #6d2998; stroke-width: 1.5; }.hot { fill: #d83c48; stroke: #922630; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1800" height="1040" fill="#f8fafc"/>
  <text x="900" y="48" text-anchor="middle" class="title">开放词汇搜索：快慢系统并行闭环</text>
  <text x="900" y="78" text-anchor="middle" class="subtitle">慢系统异步更新图与 signed 引力斥力图；快系统不等待，持续执行 R_plan 内短轨迹</text>

  <rect x="30" y="112" width="1740" height="500" rx="9" fill="#f2fbf5" stroke="#3b9962" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="30" y="652" width="1740" height="290" rx="9" fill="#f1f6fd" stroke="#4778b7" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="55" y="150" class="lane" fill="#167744">慢系统：语义 + 动态全局图</text><text x="1740" y="150" text-anchor="end" class="tiny">异步更新，不阻塞快系统</text>
  <text x="55" y="690" class="lane" fill="#245fa9">快系统：局部轨迹规划</text><text x="1740" y="690" text-anchor="end" class="tiny">始终读取最近一次可用结果</text>

  <!-- Slow lane connectors: routed through fixed horizontal gutters. -->
  <path d="M280 270H330M280 315H305V460H330" class="slow"/>
  <path d="M590 250H625V290H660M590 470H625V410H660" class="slow"/>
  <path d="M930 350H995" class="slow"/>
  <path d="M1060 285V205H1150M1125 350H1150M1060 415V495H1150" class="slow"/>
  <path d="M1400 205H1435V295H1470M1400 350H1470M1400 495H1435V405H1470" class="slow"/>

  <g transform="translate(60,190)">
    <rect width="220" height="270" rx="7" fill="#fff9e8" stroke="#c58a3f" stroke-width="2"/>
    <text x="110" y="36" text-anchor="middle" class="head">慢系统输入</text>
    <rect x="20" y="58" width="180" height="50" rx="5" fill="#fff0b8" stroke="#b69747"/><text x="110" y="89" text-anchor="middle" class="body">文本 “red building”</text>
    <rect x="20" y="121" width="180" height="50" rx="5" fill="#e3f3e9" stroke="#65a27a"/><text x="110" y="152" text-anchor="middle" class="body">RGB</text>
    <rect x="20" y="184" width="180" height="62" rx="5" fill="#fff6d6" stroke="#b69747"/><text x="110" y="210" text-anchor="middle" class="body">指定区域 / 先验地图</text><text x="110" y="232" text-anchor="middle" class="tiny">位姿与新观测反馈</text>
  </g>

  <g transform="translate(330,170)">
    <rect width="260" height="160" rx="7" fill="#fff" stroke="#cf774d" stroke-width="2"/>
    <text x="130" y="33" text-anchor="middle" class="head">持久全局图 / 活动子图</text><text x="130" y="65" text-anchor="middle" class="body">基础节点间距 ≥ R_plan</text><text x="130" y="91" text-anchor="middle" class="body">活动范围内增删节点与边</text><text x="130" y="117" text-anchor="middle" class="body">膨胀障碍后建立可见边</text>
    <g transform="translate(63,139)"><circle r="6" class="gray"/><circle cx="28" r="6" class="gray"/><circle cx="56" r="7" class="avoid"/><path d="M64 0H101" stroke="#75838d" stroke-width="2"/><circle cx="130" r="6" class="green"/></g>
  </g>
  <g transform="translate(330,390)">
    <rect width="260" height="160" rx="7" fill="#fff" stroke="#65a27a" stroke-width="2"/>
    <text x="130" y="33" text-anchor="middle" class="head">开放词汇热力图</text><text x="130" y="62" text-anchor="middle" class="body">RGB × 文本，固定 −1…+1</text>
    <rect x="42" y="82" width="44" height="35" fill="#477fc0"/><rect x="86" y="82" width="44" height="35" fill="#87afd6"/><rect x="130" y="82" width="44" height="35" fill="#ef7b38"/><rect x="174" y="82" width="44" height="35" fill="#d83c48"/>
    <text x="130" y="136" text-anchor="middle" class="tiny">有 Depth：回投最近活动节点</text><text x="130" y="153" text-anchor="middle" class="tiny">无 Depth：仅送快系统</text>
  </g>

  <g transform="translate(660,230)">
    <rect width="270" height="240" rx="7" fill="#fff" stroke="#3b9962" stroke-width="2"/>
    <text x="135" y="36" text-anchor="middle" class="head">节点状态与实时 TSP</text>
    <text x="135" y="72" text-anchor="middle" class="body">vᵢ(t) = [语义，探索，安全]</text><text x="135" y="103" text-anchor="middle" class="body">安全先硬筛；已访问降级</text><text x="135" y="134" text-anchor="middle" class="body">TSP 按可见图代价实时重排</text>
    <g transform="translate(52,174)"><circle r="9" fill="#7aa7d7"/><circle cx="55" r="9" fill="#e5bd59" stroke="#9a7620"/><circle cx="110" r="9" fill="#ef7b38" stroke="#a94a18"/><circle cx="165" r="10" class="hot"/></g>
    <text x="135" y="218" text-anchor="middle" class="tiny">弱语义时最高语义有效节点置前</text>
  </g>

  <g><path d="M995 350L1060 285L1125 350L1060 415Z" fill="#fff4dd" stroke="#cf8a38" stroke-width="2"/><text x="1060" y="337" text-anchor="middle" class="head">语义状态</text><text x="1060" y="365" text-anchor="middle" class="tiny">max similarity</text></g>
  <text x="1072" y="199" class="tiny">s &lt; τ_low</text><text x="1128" y="341" class="tiny">τ_low ≤ s &lt; τ_confirm</text><text x="1072" y="489" class="tiny">s ≥ τ_confirm</text>

  <g transform="translate(1150,165)"><rect width="250" height="80" rx="6" fill="#fff" stroke="#aeb8bf" stroke-width="2"/><text x="125" y="30" text-anchor="middle" class="head">无语义证据</text><text x="125" y="56" text-anchor="middle" class="body">覆盖 TSP 节点编码为引力</text></g>
  <g transform="translate(1150,310)"><rect width="250" height="80" rx="6" fill="#fff3df" stroke="#d39145" stroke-width="2"/><text x="125" y="30" text-anchor="middle" class="head">弱语义证据</text><text x="125" y="56" text-anchor="middle" class="body">最高语义有效节点编码为引力</text></g>
  <g transform="translate(1150,455)"><rect width="250" height="80" rx="6" fill="#e8f7ed" stroke="#3b9962" stroke-width="2"/><text x="125" y="30" text-anchor="middle" class="head">明确语义证据</text><text x="125" y="56" text-anchor="middle" class="body">视觉 signed map 直接接管</text></g>

  <g transform="translate(1470,255)">
    <rect width="250" height="190" rx="8" fill="#e7f3eb" stroke="#3b9962" stroke-width="2"/>
    <text x="125" y="37" text-anchor="middle" class="head">慢系统异步发布</text><text x="125" y="74" text-anchor="middle" class="body">三态引力斥力编码</text><text x="125" y="103" text-anchor="middle" class="tiny">双阈值 + 滞回 / 连续帧确认</text>
    <rect x="24" y="126" width="202" height="44" rx="5" fill="#fff" stroke="#65a27a"/><text x="125" y="145" text-anchor="middle" class="head">signed 引力斥力图</text><text x="125" y="164" text-anchor="middle" class="tiny">固定尺度 −1…+1</text>
  </g>

  <!-- One asynchronous handoff in the gutter between lanes. -->
  <path d="M1595 445V632H965V700" class="slow"/><text x="1280" y="626" text-anchor="middle" class="tiny" fill="#168a50">异步发布最新结果</text>

  <!-- Fast lane: a single left-to-right chain. -->
  <path d="M360 790H500M1200 790H1390" class="fast"/>
  <g transform="translate(60,710)"><rect width="300" height="160" rx="7" fill="#fff" stroke="#7394bd" stroke-width="2"/><text x="150" y="36" text-anchor="middle" class="head">实时输入</text><text x="150" y="72" text-anchor="middle" class="body">Depth + signed 引力斥力图</text><text x="150" y="103" text-anchor="middle" class="body">速度 / 加速度 state</text><text x="150" y="134" text-anchor="middle" class="tiny">慢系统未更新时沿用上一张图</text></g>
  <g transform="translate(500,690)">
    <rect width="700" height="200" rx="8" fill="#fff" stroke="#4778b7" stroke-width="2"/>
    <text x="350" y="36" text-anchor="middle" class="head">R_plan 内局部轨迹规划</text>
    <g transform="translate(120,120)"><circle r="66" fill="#e8f7ed" fill-opacity="0.22" stroke="#c45a08" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="60" cy="-38" r="48" fill="#d83c48" fill-opacity="0.18"/><circle cx="43" cy="-8" r="38" fill="#477fc0" fill-opacity="0.2"/><rect x="25" y="-29" width="36" height="42" fill="#69747d" stroke="#343d44"/><path d="M0 0C7 35 68 27 60 -38" fill="none" stroke="#1ca55c" stroke-width="5" marker-end="url(#wf-green)"/><circle r="11" fill="#07966a" stroke="#075b49" stroke-width="2"/><circle cx="60" cy="-38" r="9" class="hot"/></g>
    <text x="485" y="77" text-anchor="middle" class="body">暖区产生吸引，冷区产生排斥</text><text x="485" y="107" text-anchor="middle" class="body">Depth 提供局部障碍约束</text><text x="485" y="137" text-anchor="middle" class="body">网络直接预测安全短轨迹</text><text x="485" y="169" text-anchor="middle" class="tiny">输出始终限制在 R_plan 内</text>
  </g>
  <g transform="translate(1390,710)"><rect width="300" height="160" rx="8" fill="#e8f1fc" stroke="#4778b7" stroke-width="2"/><text x="150" y="38" text-anchor="middle" class="head">执行短轨迹</text><text x="150" y="75" text-anchor="middle" class="body">轨迹长度 ≤ R_plan</text><text x="150" y="106" text-anchor="middle" class="body">更新位姿与访问状态</text><text x="150" y="136" text-anchor="middle" class="tiny">快系统立即再次规划</text></g>

  <!-- Feedback stays on lane boundaries, never crosses a module. -->
  <path d="M1540 870V920H210V870" class="fast"/><text x="875" y="914" text-anchor="middle" class="tiny" fill="#2767d4">快系统闭环：执行后立即使用新状态再次规划</text>
  <path d="M1690 790H1750V590H170V460" class="slow"/><text x="1740" y="585" text-anchor="end" class="tiny" fill="#168a50">位姿 / 新观测反馈慢系统</text>

  <g transform="translate(170,990)"><circle r="7" class="gray"/><text x="16" y="5" class="tiny">基础节点</text><circle cx="125" r="7" class="avoid"/><text x="143" y="5" class="tiny">避障节点</text><circle cx="250" r="7" class="green"/><text x="266" y="5" class="tiny">已访问</text><circle cx="350" r="8" class="hot"/><text x="368" y="5" class="tiny">高语义得分</text><path d="M500 0H560" stroke="#d97706" stroke-width="3"/><text x="576" y="5" class="tiny">TSP 全局路径</text><circle cx="740" r="24" fill="none" stroke="#c45a08" stroke-width="2" stroke-dasharray="5 4"/><text x="775" y="5" class="tiny">R_plan</text><path d="M865 6C887 -12 912 15 940 0" fill="none" stroke="#1ca55c" stroke-width="5"/><text x="958" y="5" class="tiny">局部短轨迹</text></g>
</svg>
